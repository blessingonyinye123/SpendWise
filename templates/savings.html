<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Savings</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">SpendWise</h1>
            <nav class="hidden md:flex space-x-6 text-sm font-medium">
                <a href="/dashboard" class="text-gray-600 hover:text-blue-600">Dashboard</a>
                <a href="/expenses" class="text-gray-600 hover:text-blue-600">Expenses</a>
                <a href="/budgets" class="text-gray-600 hover:text-blue-600">Budgets</a>
                <a href="/savings" class="text-blue-600 font-semibold">Savings</a>
                <a href="/reports" class="text-gray-600 hover:text-blue-600">Reports</a>
                <a href="/blog" class="text-gray-600 hover:text-blue-600">Blog</a>
            </nav>
            <form action="/set_currency" method="POST" class="flex items-center space-x-2">
                <select name="currency" onchange="this.form.submit()" class="text-sm bg-gray-100 border border-gray-300 rounded p-1 cursor-pointer">
                    {% for symbol, name in currencies.items() %}
                        <option value="{{ symbol }}" {% if currency == symbol %}selected{% endif %}>{{ symbol }} ({{ name }})</option>
                    {% endfor %}
                </select>
            </form>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">
        
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900">Savings Goals</h2>
        </div>

        <!-- Collapsible Mobile-Friendly Add Goal Dropdown -->
        <details class="bg-white rounded-xl shadow-sm border border-gray-200 mb-6 p-4 group">
            <summary class="font-semibold cursor-pointer text-blue-600 flex justify-between items-center select-none">
                <span class="flex items-center gap-2">💰 Add New Savings Goal</span>
                <span class="text-xs text-gray-400 group-open:rotate-180 transition-transform">▼ Tap to toggle</span>
            </summary>
            
            <form action="/add_goal" method="POST" class="mt-4 pt-4 border-t border-gray-100 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Goal Name</label>
                    <input type="text" name="name" placeholder="e.g., Emergency Fund" class="w-full p-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Target Amount</label>
                    <input type="number" step="any" name="target_amount" placeholder="0.00" class="w-full p-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Current Saved (Optional)</label>
                    <input type="number" step="any" name="current_amount" placeholder="0.00" class="w-full p-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="md:col-span-3 pt-2">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition-
