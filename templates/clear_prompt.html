{% extends "base.html" %}
{% block title %}Clear Confirmation - SpendWise{% endblock %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="card" style="max-width: 500px; width: 100%; text-align: center; padding: 35px;">
        <h2 style="color: var(--danger); margin-bottom: 10px;">⚠️ Clear All Expenses</h2>
        <p style="color: var(--text-light); font-size: 1rem; margin-bottom: 25px;">
            Do you also want to clear your active budgets and spending progress too?
        </p>
        
        <form action="/execute_clear" method="POST" style="display: flex; gap: 15px; justify-content: center;">
            <button type="submit" name="clear_budgets" value="yes" style="background-color: var(--danger); padding: 12px 24px;">Yes, Clear Budgets Too</button>
            <button type="submit" name="clear_budgets" value="no" style="background-color: var(--text-light); padding: 12px 24px;">No, Keep Budgets</button>
        </form>
        
        <div style="margin-top: 20px;">
            <a href="/expenses" style="color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 600;">← Cancel and Go Back</a>
        </div>
    </div>
</div>
{% endblock %}
