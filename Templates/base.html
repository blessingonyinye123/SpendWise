<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%234f46e5%22 stroke-width=%222.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M3 17l6-6 4 4 8-8%22/><polyline points=%2214 7 21 7 21 14%22/></svg>">
    <title>{% block title %}SpendWise{% endblock %}</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --danger: #ef4444;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        sidebar {
            width: 270px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 28px 20px;
            position: fixed;
            height: 100vh;
            box-sizing: border-box;
            z-index: 100;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .nav-brand {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .nav-brand svg {
            width: 28px;
            height: 28px;
            stroke: var(--primary);
            fill: none;
            transition: transform 0.3s ease;
        }

        .nav-brand:hover svg {
            transform: scale(1.15) rotate(-5deg);
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.93rem;
            padding: 11px 14px;
            border-radius: 10px;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links a:hover {
            color: var(--primary);
            background: #eef2ff;
            transform: translateX(4px);
        }

        .sidebar-footer {
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .currency-form select {
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #f8fafc;
            font-weight: 600;
            color: var(--primary);
            outline: none;
            width: 100%;
        }

        .admin-link {
            font-size: 0.82rem;
            color: var(--text-light);
            text-decoration: none;
            text-align: center;
            font-weight: 500;
            transition: color 0.2s;
        }

        .admin-link:hover {
            color: var(--primary);
        }

        .main-content {
            margin-left: 270px;
            flex: 1;
            padding: 40px;
            box-sizing: border-box;
            max-width: 1200px;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
            padding: 30px;
            margin-bottom: 28px;
            border: 1px solid var(--border);
        }

        input, select, textarea {
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            background: #fff;
        }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            sidebar {
                position: relative;
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 20px;
            }
            .main-content { margin-left: 0; padding: 20px 16px; max-width: 100%; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <sidebar>
        <div class="sidebar-top">
            <a href="/" class="nav-brand">
                <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 17l6-6 4 4 8-8"/>
                    <polyline points="14 7 21 7 21 14"/>
                </svg>
                SpendWise
            </a>
            <div class="nav-links">
                <a href="/">🏠 Home</a>
                <a href="/dashboard">📊 Dashboard</a>
                <a href="/expenses">💸 Expenses</a>
                <a href="/budgets">🎯 Budgets</a>
                <a href="/savings">💰 Savings Goals</a>
                <a href="/reports">📈 Reports</a>
                <a href="/blog">📖 Financial Guide & Blog</a>
            </div>
        </div>

        <div class="sidebar-footer">
            <form action="/set_currency" method="POST" class="currency-form">
                <select name="currency" onchange="this.form.submit()">
                    {% for code, name in currencies.items() %}
                        <option value="{{ code }}" {% if currency == code %}selected{% endif %}>{{ code }} - {{ name.split(' ')[0] }}</option>
                    {% endfor %}
                </select>
            </form>

            <div style="background: #eef2ff; color: var(--primary); padding: 9px 12px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; text-align: center; display: flex; justify-content: space-between; align-items: center;">
                <span>👋 Hello, {{ session.get('user_name', 'Friend') }}</span>
                <a href="/login" style="font-size: 0.75rem; color: var(--primary); text-decoration: underline;">Change</a>
            </div>

            <a href="/admin/blog" class="admin-link">🔒 Admin Article Portal</a>
        </div>
    </sidebar>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let dateInput = document.querySelector('input[type="date"]');
            if (dateInput && !dateInput.value) {
                dateInput.value = new Date().toISOString().split('T')[0];
            }
        });

        function confirmDelete(event, itemName) {
            if (!confirm(`Are you sure you want to permanently delete "${itemName}"?`)) {
                event.preventDefault();
            }
        }
    </script>
</body>
</html>
